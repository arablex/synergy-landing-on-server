# Конфиг nginx для лендинга на сервере.
# Положить в /etc/nginx/sites-available/landing, затем:
#   sudo ln -s /etc/nginx/sites-available/landing /etc/nginx/sites-enabled/landing
#   sudo nginx -t && sudo systemctl reload nginx
# [[ДОМЕН]] заменить на ваш домен (например, example.com).
server {
    listen 80;
    listen [::]:80;
    server_name [[ДОМЕН]] www.[[ДОМЕН]];

    root /var/www/landing;
    index index.html;

    # сжатие текстовых файлов
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # кэш статики на 7 дней
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
